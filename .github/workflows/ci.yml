name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier l'architecture
        run: npm run architecture:check

      - name: Vérifier les types
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Construire
        run: npm run build 2>&1 | tee build.log

      - name: Publier les diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            typecheck.log
            build.log
          if-no-files-found: ignore
          retention-days: 3
